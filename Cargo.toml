[workspace]
resolver = "2"
members = ["crates/feroconf-core", "crates/feroconf-collect", "crates/feroconf-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jkobierczynski/FeroConf"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
git2 = { version = "0.20", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
similar = "2"
# heap_buffers: without it every SNMP session carries a 64 KiB buffer inline, which overflows
# the stack once a few async futures are nested.
snmp2 = { version = "0.5", default-features = false, features = ["tokio", "crypto-rust", "heap_buffers"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
