[workspace]
resolver = "2"
members = ["crates/feroconf-core", "crates/feroconf-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jkobierczynski/FeroConf"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
git2 = { version = "0.20", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
similar = "2"
tempfile = "3"
thiserror = "2"
toml = "0.8"
