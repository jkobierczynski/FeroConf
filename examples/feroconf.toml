# Example FeroConf inventory. Copy it to feroconf.toml and adjust.

[defaults]
# Address the routers use to reach FeroConf's built-in TFTP server.
tftp_server = "192.0.2.10"

[defaults.snmp]
version = "v2c"
# Keep secrets out of this file: read them from the environment or a file.
write_community = { env = "FEROCONF_RW_COMMUNITY" }

[backup]
# FeroConf's own TFTP server. Routers always upload to port 69, which needs root or
# CAP_NET_BIND_SERVICE: sudo setcap cap_net_bind_service=+ep $(which feroconf)
tftp_listen = "0.0.0.0:69"
timeout_secs = 120      # per device
snmp_timeout_ms = 2000
snmp_retries = 2
concurrency = 8         # devices backed up at the same time

[[device]]
name = "core-rtr1"
host = "192.0.2.1"
vendor = "cisco-ios"        # cisco-ios (default), cisco-ios-xe or cisco-nxos

[[device]]
name = "edge-rtr2"
host = "192.0.2.2"
vendor = "cisco-ios-xe"
# snmp_port = 161

# A device-level [device.snmp] table replaces [defaults.snmp] for that device.
[device.snmp]
version = "v3"
user = "feroconf"
auth_protocol = "sha256"    # md5, sha, sha224, sha256, sha384, sha512
auth_password = { file = "/etc/feroconf/snmp-auth" }
priv_protocol = "aes128"    # des, aes128, aes192, aes256
priv_password = { file = "/etc/feroconf/snmp-priv" }
